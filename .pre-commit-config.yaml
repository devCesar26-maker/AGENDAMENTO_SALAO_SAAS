# Hooks de qualidade: ruff (lint + isort) e black (formatação).
# Instalação: pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        args: [--fix]
        exclude: "migrations"
  - repo: https://github.com/psf/black-pre-commit
    rev: 26.3.1
    hooks:
      - id: black
        exclude: "migrations"
