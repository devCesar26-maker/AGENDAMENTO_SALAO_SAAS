name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Versões PINADAS em .pre-commit-config.yaml (rev: v0.14.14 / 25.12.0).
      # Ao atualizar lá, atualize aqui também — versões divergentes entre local
      # (pre-commit) e CI causam falsos reprovados de formatação/lint.
      - run: pip install ruff==0.14.14 black==25.12.0
      - run: ruff check backend
      - run: black --check backend

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecalt
          POSTGRES_PASSWORD: ecalt
          POSTGRES_DB: ecalt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecalt"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Checagens do Django
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Testes com cobertura
        env:
          DATABASE_URL: postgres://ecalt:ecalt@localhost:5432/ecalt
          REDIS_URL: redis://localhost:6379/1
        run: pytest --cov=backend --cov-fail-under=80 --cov-report=term

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - run: bandit -r backend -x "backend/*/migrations/*,backend/config/settings/*,backend/*/tests/*" -q
        # Asserções em testes geram B101 e senhas fictícias B105 — excluídos por padrão.
      # Vulnerabilidades conhecidas apenas em deps de DEV (black/pytest), sem
      # impacto em produção; upgrades acompanhados separadamente.
      - run: >-
          pip-audit -r backend/requirements.txt
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-2120
          --ignore-vuln PYSEC-2026-2121

  # ── Frontend (DESATIVADO nesta fase) ─────────────────────────────────────
  # O frontend é apenas o scaffold inicial (Vite + TS) e não está sendo
  # trabalhado nesta fase — decisão registrada de ignorá-lo por ora.
  #
  # Enquanto isso, o job "frontend" abaixo SÓ roda quando houver mudanças em
  # `frontend/**`: hoje ele fica skipado (aparece como skipped, não falha) e
  # volta a rodar sozinho assim que a fase de frontend começar e alterar o
  # diretório /frontend.
  #
  # REATIVAÇÃO EM FASE DE FRONTEND: quando essa fase iniciar, basta tornar o
  # lint/build/test do frontend obrigatório (ex.: remover o `needs`/`if` abaixo
  # para rodar sempre, ou torná-lo required nas branch protection rules).

  # Detecta se o PR/push tem mudanças relevantes em frontend/**.
  frontend-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  frontend:
    needs: frontend-changes
    if: needs.frontend-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint --if-present
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
