[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "DJ",       # django
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = ["E501", "SIM108", "DJ001"]

[tool.ruff.lint.per-file-ignores]
# `objects = UserManager()` e TextChoices são convenções Django, não mutáveis acidentais.
"**/models.py" = ["RUF012"]
# Atributos de classe DRF (throttle_classes, permission_classes etc.) são convenção DRF.
"**/views.py" = ["RUF012"]
"**/serializers.py" = ["RUF012"]
"**/factories.py" = ["RUF012", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "accounts", "organizations", "catalog", "customers", "scheduling", "billing", "notifications", "analytics"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "migrations"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend"]
python_files = ["test_*.py"]
addopts = "--reuse-db -q"
testpaths = ["backend"]
